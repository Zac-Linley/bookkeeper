name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        run: pnpm --dir packages/worker exec tsc --noEmit

      - name: Run worker tests
        run: pnpm --dir packages/worker test

      - name: Build frontend
        run: pnpm -F frontend build
